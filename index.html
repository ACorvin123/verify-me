<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="main-container">
        <div id="verify-section" class="section active">
            <h1 class="title">Verify me?</h1>
            <div class="custom-select-wrapper">
                <select id="name-select" class="custom-select">
                    <option value="" disabled selected>Select a name</option>
                    <option value="Mick">Mick</option>
                    <option value="Mike R">Mike R</option>
                    <option value="Melden P">Melden P</option>
                    <option value="David B">David B</option>
                    <option value="Andrei B">Andrei B</option>
                    <option value="Alex P">Alex P</option>
                    <option value="Filip L">Filip L</option>
                </select>
                <div class="select-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
            </div>
            <button id="verify-button" class="btn">Verify me</button>
            <p id="error-message" class="error-message">Please select a name first.</p>
        </div>
        
        <div id="result-section" class="section hidden">
            <h1 id="result-message" class="title result-title"></h1>
            <button id="back-button" class="btn btn-secondary">Go Back</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
